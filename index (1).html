<style id="style">
/* Layout: one phone-width column of sticker-like postcards; the leader's desk and each friend's secret card share it */
:root{
  --bg:#FFF2F0; --surface:#FFFFFF; --surface-2:#FFE6E3; --ink:#4A2C34; --ink-soft:#8C6870; --line:#F3D1D0;
  --berry:#EF5B82; --berry-deep:#C9405F; --berry-soft:#FFA3B9; --on-berry:#FFFFFF;
  --butter:#FFD467; --butter-deep:#E9B23A; --on-butter:#4A2C34;
  --mint:#AEE3CC; --mint-deep:#6FBF9E; --on-mint:#1F4A39;
  --blush:#FFB8C6; --shadow-c:#F0C9C8; --danger:#D23E5C; --ok:#2E9B6E;
  --f-display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#231A1E; --surface:#32252A; --surface-2:#3E2E34; --ink:#FBECEF; --ink-soft:#C6A6AE; --line:#4D3940;
  --berry:#FF7B9C; --berry-deep:#D85B7B; --berry-soft:#B85772; --on-berry:#2A1419;
  --butter:#F2C55A; --butter-deep:#C99A2E; --on-butter:#3A2412;
  --mint:#7FC8AC; --mint-deep:#56A386; --on-mint:#0F2E22;
  --blush:#C96C84; --shadow-c:#170F12; --danger:#FF7A90; --ok:#7FD9AE; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#231A1E; --surface:#32252A; --surface-2:#3E2E34; --ink:#FBECEF; --ink-soft:#C6A6AE; --line:#4D3940;
  --berry:#FF7B9C; --berry-deep:#D85B7B; --berry-soft:#B85772; --on-berry:#2A1419;
  --butter:#F2C55A; --butter-deep:#C99A2E; --on-butter:#3A2412;
  --mint:#7FC8AC; --mint-deep:#56A386; --on-mint:#0F2E22;
  --blush:#C96C84; --shadow-c:#170F12; --danger:#FF7A90; --ok:#7FD9AE; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;
  background-image:radial-gradient(var(--line) 1.4px,transparent 1.6px);background-size:22px 22px}
#app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3,.display{font-family:var(--f-display);font-weight:400;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,7.5vw,38px);line-height:1.2}
h2{font-size:22px;line-height:1.3}
h3{font-size:18px}
p{margin:0}
.soft{color:var(--ink-soft)}
.small{font-size:14px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--butter-deep);outline-offset:2px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;padding-top:14px}
.logo{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;font-family:var(--f-display);font-size:20px}
.logo{min-width:0;text-align:left}
.logo img{width:36px;height:36px;flex:none;border-radius:50%;background:#FFFFFF;object-fit:contain;padding:3px;border:2px solid var(--line)}
.logo span{overflow-wrap:anywhere;line-height:1.2}
.crest{width:150px;flex:none;background:#FFFFFF;border-radius:26px;padding:12px;border:2px solid var(--line);box-shadow:0 5px 0 var(--shadow-c);transform:rotate(3deg)}
.crest img{display:block;width:100%;height:auto}
@media (max-width:400px){.logo{font-size:18px}.stamp{display:none}}
.stamp{font-family:var(--f-display);font-size:13px;color:var(--berry);border:2px dashed var(--berry);border-radius:8px;padding:2px 8px;transform:rotate(-4deg)}

/* panels */
.panel{background:var(--surface);border:2px solid var(--line);border-radius:22px;box-shadow:0 5px 0 var(--shadow-c);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel.tint{background:var(--surface-2)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:var(--f-display);font-size:17px;border-radius:999px;border:2px solid transparent;padding:12px 20px;transition:transform .12s,box-shadow .12s;background:var(--surface-2);color:var(--ink);box-shadow:0 4px 0 var(--shadow-c)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow-c)}
.btn.berry{background:var(--berry);color:var(--on-berry);box-shadow:0 4px 0 var(--berry-deep)}
.btn.berry:active{box-shadow:0 1px 0 var(--berry-deep)}
.btn.butter{background:var(--butter);color:var(--on-butter);box-shadow:0 4px 0 var(--butter-deep)}
.btn.butter:active{box-shadow:0 1px 0 var(--butter-deep)}
.btn.mint{background:var(--mint);color:var(--on-mint);box-shadow:0 4px 0 var(--mint-deep)}
.btn.ghost{background:transparent;border-color:var(--line);box-shadow:none}
.btn.sm{font-size:15px;padding:7px 14px}
.btn.wide{width:100%}
.btn.warn{background:var(--danger);color:var(--surface);box-shadow:none}
.btn[disabled]{opacity:.55;pointer-events:none}
.link{background:none;border:0;padding:0;color:var(--berry);font-family:var(--f-display);font-size:15px;text-decoration:underline;text-underline-offset:3px}

/* hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding-top:6px}
.hero .lead{display:flex;flex-direction:column;gap:10px;min-width:0}
.eyebrow{font-family:var(--f-display);font-size:14px;color:var(--berry);letter-spacing:.04em}
.hero .crest{justify-self:end}
@media (max-width:400px){.hero{grid-template-columns:1fr auto}.hero .crest{width:112px;padding:8px;border-radius:20px}}

.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border-radius:22px;padding:18px 16px;border:0;min-height:112px;justify-content:flex-end}
.choice b{font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.25}
.choice span{font-size:13px;opacity:.85}
.choice.berry{background:var(--berry);color:var(--on-berry);box-shadow:0 5px 0 var(--berry-deep)}
.choice.butter{background:var(--butter);color:var(--on-butter);box-shadow:0 5px 0 var(--butter-deep)}
.choice:active{transform:translateY(3px)}
@media (max-width:360px){.choices{grid-template-columns:1fr}}

/* steps */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--f-display);width:34px;height:34px;border-radius:50%;background:var(--butter);color:var(--on-butter);display:grid;place-items:center;font-size:17px}
.steps b{font-family:var(--f-display);font-weight:400;font-size:17px;display:block}

/* list items */
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--surface-2);border:0;text-align:left;width:100%}
.item .meta{flex:1;min-width:0}
.item .meta b{font-family:var(--f-display);font-weight:400;font-size:17px;display:block;overflow-wrap:anywhere}
.item .meta span{font-size:13px;color:var(--ink-soft)}
.badge{font-family:var(--f-display);font-size:13px;padding:3px 10px;border-radius:999px;background:var(--mint);color:var(--on-mint);white-space:nowrap}
.badge.pink{background:var(--blush);color:var(--ink)}
.badge.butter{background:var(--butter);color:var(--on-butter)}
.ava{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;background:var(--blush);color:var(--ink)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-family:var(--f-display);font-size:16px}
.field .hint{font-size:13px;color:var(--ink-soft)}
.input,textarea.input{width:100%;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:11px 14px;font-size:16px;outline:none}
.input:focus{border-color:var(--berry)}
textarea.input{resize:vertical;min-height:110px;line-height:1.55}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 16px;font-family:var(--f-display);font-size:16px}
.seg button[aria-pressed="true"]{background:var(--berry);border-color:var(--berry);color:var(--on-berry)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipn{background:var(--surface-2);border-radius:999px;padding:3px 12px;font-size:14px}
.chipn.dup{background:var(--danger);color:var(--surface)}
.mlist{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto;padding-right:2px}
.mrow{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:12px;padding:8px 8px 8px 12px;font-size:15px}
.mrow span{flex:1;min-width:0;overflow-wrap:anywhere}
.x{flex:none;width:30px;height:30px;border-radius:50%;border:0;background:var(--surface);color:var(--ink-soft);font-size:16px;line-height:1}
.err{color:var(--danger);font-size:14px;min-height:1em}

/* admin member rows */
.mem{background:var(--surface-2);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.mem-top{display:flex;align-items:center;gap:10px}
.mem-top .meta{flex:1;min-width:0}
.mem-top .meta b{font-family:var(--f-display);font-weight:400;font-size:18px;overflow-wrap:anywhere}
.pw{font-family:var(--f-display);font-size:15px;letter-spacing:.12em;font-variant-numeric:tabular-nums;color:var(--berry)}
.peek{background:var(--surface);border-radius:12px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.peek b{font-family:var(--f-display);font-weight:400;font-size:16px}
.progress{height:12px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--mint-deep);border-radius:999px;transition:width .3s}

/* unlock keypad */
.lock{align-items:center;text-align:center}
.dots{display:flex;gap:14px;justify-content:center;margin:4px 0}
.dots i{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--berry);display:block;transition:background .15s,transform .15s}
.dots i.on{background:var(--berry);transform:scale(1.1)}
.pad{display:grid;grid-template-columns:repeat(3,68px);gap:12px;justify-content:center}
.pad button{width:68px;height:68px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-family:var(--f-display);font-size:26px;box-shadow:0 4px 0 var(--shadow-c)}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow-c)}
.pad button.fn{font-size:16px;background:var(--surface-2)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* gift svg */
.gift .g-box{fill:var(--berry-soft)}
.gift .g-lid{fill:var(--berry)}
.gift .g-rib{fill:var(--butter)}
.gift .g-knot{fill:var(--butter-deep)}
.gift .g-eye{fill:var(--ink)}
.gift .g-blush{fill:var(--blush)}
.gift .g-mouth{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.gift .lid{transform-box:fill-box;transform-origin:50% 100%;transition:transform .7s cubic-bezier(.3,1.6,.5,1)}
.gift.wiggle{animation:wig 2.4s ease-in-out infinite}
@keyframes wig{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-5deg)}80%{transform:rotate(5deg)}85%{transform:rotate(-3deg)}90%{transform:rotate(2deg)}}
.gift.open .lid{transform:translate(18px,-46px) rotate(22deg)}

/* reveal card */
.reveal{position:relative;overflow:hidden;align-items:center;text-align:center;gap:10px;padding-block:26px}
.reveal .to{font-size:15px;color:var(--ink-soft)}
.reveal .who{font-family:var(--f-display);font-size:clamp(40px,12vw,58px);line-height:1.1;color:var(--berry);overflow-wrap:anywhere}
.reveal .tag{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pop{animation:pop .55s cubic-bezier(.3,1.5,.5,1) both}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;bottom:-12px;width:10px;height:14px;border-radius:3px;animation:fly 1.6s ease-out forwards}
@keyframes fly{to{transform:translateY(-320px) rotate(540deg);opacity:0}}

.mission{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border-radius:16px;padding:12px 14px;border:0;text-align:left;width:100%}
.mission .box{flex:none;width:28px;height:28px;border-radius:9px;border:2.5px solid var(--berry);display:grid;place-items:center;background:var(--surface);color:var(--on-berry);font-size:16px;margin-top:1px}
.mission[aria-pressed="true"] .box{background:var(--berry)}
.mission[aria-pressed="true"] .txt{text-decoration:line-through;text-decoration-color:var(--berry);color:var(--ink-soft)}
.mission .txt{flex:1;min-width:0;font-size:16px}

.stickers{display:flex;gap:6px;flex-wrap:wrap}
.stickers button{width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:22px}
.stickers button[aria-pressed="true"]{border-color:var(--berry);background:var(--surface-2);transform:scale(1.08)}
.entry{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:start;background:var(--surface-2);border-radius:16px;padding:12px}
.entry .st{width:44px;height:44px;border-radius:14px;background:var(--surface);display:grid;place-items:center;font-size:22px}
.entry .body{min-width:0}
.entry .date{font-family:var(--f-display);font-size:14px;color:var(--berry);font-variant-numeric:tabular-nums}
.entry p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.empty{text-align:center;color:var(--ink-soft);font-size:14px;padding:14px;border:2px dashed var(--line);border-radius:16px}

.example{position:relative}
.example::after{content:"예시";position:absolute;top:14px;right:16px;font-family:var(--f-display);font-size:13px;color:var(--ink-soft);border:2px solid var(--line);border-radius:8px;padding:0 8px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-family:var(--f-display);padding:10px 18px;border-radius:999px;z-index:20;max-width:calc(100% - 32px);text-align:center;animation:pop .3s both}
.sheet{position:fixed;inset:0;background:rgba(30,15,20,.45);z-index:15;display:flex;align-items:flex-end;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .panel{width:100%;max-width:520px}
.foot{font-size:13px;color:var(--ink-soft);text-align:center;padding:0 8px}
/* letters */
.env{position:relative;width:100%;border:0;background:var(--butter);color:var(--on-butter);border-radius:16px;padding:26px 16px 16px;text-align:left;box-shadow:0 4px 0 var(--butter-deep);display:flex;gap:12px;align-items:center;overflow:hidden}
.env::before{content:"";position:absolute;inset:0 0 auto 0;height:24px;background:var(--butter-deep);clip-path:polygon(0 0,100% 0,50% 100%);opacity:.6}
.env:active{transform:translateY(3px);box-shadow:0 1px 0 var(--butter-deep)}
.env .seal{flex:none;width:42px;height:42px;border-radius:50%;background:var(--berry);color:var(--on-berry);display:grid;place-items:center;font-size:19px}
.env b{font-family:var(--f-display);font-weight:400;font-size:17px;display:block}
.letter{background:var(--surface);border:2px dashed var(--berry-soft);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.letter .sign{align-self:flex-end;font-family:var(--f-display);color:var(--berry);font-size:17px}
.quote{white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px;line-height:1.7;background:var(--surface-2);border-radius:14px;padding:14px 16px}
.more summary{cursor:pointer;color:var(--ink-soft);font-size:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ===== 암호화 (AES-GCM + PBKDF2), base62 ===== */
const enc = new TextEncoder(), dec = new TextDecoder();
const A62 = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
function b62(bytes){ let n = 1n; for(const x of bytes) n = (n << 8n) | BigInt(x); let s = ""; while(n > 0n){ s = A62[Number(n % 62n)] + s; n /= 62n; } return s; }
function unb62(s){ let n = 0n; for(const c of s){ const i = A62.indexOf(c); if(i < 0) throw new Error("bad"); n = n * 62n + BigInt(i); }
  const out = []; while(n > 1n){ out.push(Number(n & 255n)); n >>= 8n; } if(n !== 1n) throw new Error("bad"); return Uint8Array.from(out.reverse()); }
async function deriveKey(pw, salt){
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:40000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function seal(pw, obj){
  const salt = crypto.getRandomValues(new Uint8Array(8)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pw, salt);
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, enc.encode(JSON.stringify(obj))));
  const out = new Uint8Array(21 + ct.length); out[0] = 1; out.set(salt, 1); out.set(iv, 9); out.set(ct, 21);
  return b62(out);
}
async function unseal(pw, str){
  const b = unb62(String(str)); if(b[0] !== 1) throw new Error("bad");
  const key = await deriveKey(pw, b.slice(1, 9));
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b.slice(9, 21)}, key, b.slice(21));
  return JSON.parse(dec.decode(pt));
}
// 비밀번호만으로 카드를 찾기 위한 색인 (비밀번호 자체는 저장하지 않아요)
async function idxKey(gid, pin){
  const base = await crypto.subtle.importKey("raw", enc.encode(gid + ":" + pin), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", salt:enc.encode("idx:socaf-manitto"), iterations:40000, hash:"SHA-256"}, base, 72));
  return b62(bits);
}

// 일기 보고서: 그룹 열쇠로 잠가서 리더 관리실에서만 풀어요
async function gidKey(gid){ const h = await crypto.subtle.digest("SHA-256", enc.encode("manitto-diary:" + gid)); return crypto.subtle.importKey("raw", h, "AES-GCM", false, ["encrypt","decrypt"]); }
async function sealG(gid, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv}, await gidKey(gid), enc.encode(JSON.stringify(obj))));
  const out = new Uint8Array(13 + ct.length); out[0] = 2; out.set(iv, 1); out.set(ct, 13); return b62(out);
}
async function unsealG(gid, str){
  const b = unb62(str); if(b[0] !== 2) throw new Error("bad");
  return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:b.slice(1, 13)}, await gidKey(gid), b.slice(13))));
}

function rand(n){ const x = new Uint32Array(1); crypto.getRandomValues(x); return x[0] % n; }
function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function randPin(used){ let p; do{ p = String(rand(10000)).padStart(4, "0"); }while(used.has(p)); return p; }
function drawAll(names, pool, count){
  // 한 줄로 이어진 원 모양 추첨: 자기 자신도, 서로가 서로의 마니또인 경우도 생기지 않아요
  const order = shuffle(names), target = {};
  order.forEach((n, i) => target[n] = order[(i + 1) % order.length]);
  let bag = []; const take = () => { if(!bag.length) bag = shuffle(pool); return bag.pop(); };
  return names.map(n => {
    const ms = []; let guard = 0;
    while(ms.length < Math.min(count, pool.length) && guard++ < 200){ const m = take(); if(!ms.includes(m)) ms.push(m); }
    return {name:n, target:target[n], missions:ms, pw:"", code:"", key:""};
  });
}

function copyText(text){
  // 1) 화면 안 임시 칸을 선택해 바로 복사  2) 클립보드 API  3) 둘 다 안 되면 직접 복사할 수 있게 보여줘요
  let ok = false;
  try{
    const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;";
    document.body.appendChild(ta); ta.focus(); ta.select(); try{ ta.setSelectionRange(0, text.length); }catch(_){}
    ok = document.execCommand("copy"); ta.remove();
  }catch(e){}
  let p = Promise.resolve(false);
  try{ if(navigator.clipboard && navigator.clipboard.writeText) p = navigator.clipboard.writeText(text).then(() => true, () => false); }catch(e){}
  return p.then(ok2 => {
    if(ok || ok2) return true;
    showSheet(`<h3>아래 내용을 길게 눌러 복사해 주세요</h3><textarea class="input" id="manualText" readonly style="min-height:180px">${esc(text)}</textarea><button class="btn berry wide" data-act="closeSheet">닫기</button>`, () => { const t = $("#manualText"); t.focus(); t.select(); });
    return false;
  });
}
function showSheet(html, after){ closeSheet(); const s = document.createElement("div"); s.className = "sheet"; s.innerHTML = `<div class="panel">${html}</div>`; s.addEventListener("click", e => { if(e.target === s) closeSheet(); }); document.body.appendChild(s); after && after(); }
function closeSheet(){ document.querySelectorAll(".sheet").forEach(e => e.remove()); }
document.addEventListener("click", e => { if(e.target.closest('[data-act="closeSheet"]')) closeSheet(); });

function updateChips(){
  const names = parseNames(S.draft.members), seen = {};
  const c = $("#memChips"), n = $("#memCount"); if(!c) return;
  n.textContent = names.length + "명";
  c.innerHTML = names.map(x => { const dup = seen[x]; seen[x] = 1; return `<span class="chipn${dup ? " dup" : ""}">${esc(x)}</span>`; }).join("");
}
function setBusy(t){ S.busy = t; const b = $('[data-act="doDraw"]'); if(b){ b.textContent = t; b.disabled = true; } }

async function doDraw(){
  const d = S.draft, edit = !!d.editId;
  const names = parseNames(d.members);
  const fail = m => { S.err = m; const e = $("#err"); if(e){ e.textContent = m; e.scrollIntoView({block:"center", behavior:"smooth"}); } };
  if(!d.name.trim()) return fail("그룹 이름을 적어 주세요.");
  if(names.length < 3) return fail("참여자는 3명 이상이어야 해요.");
  if(names.length > 60) return fail("참여자는 60명까지 넣을 수 있어요.");
  if(new Set(names).size !== names.length) return fail("이름이 겹쳐요. 같은 이름은 '지우A', '지우B'처럼 구분해 주세요.");
  if(!d.pool.length) return fail("미션을 하나 이상 넣어 주세요.");
  if(!edit){ if(d.pw.length < 4) return fail("리더 관리 비밀번호를 4자 이상으로 정해 주세요."); if(d.pw !== d.pw2) return fail("비밀번호 두 개가 서로 달라요."); }
  const adminPw = edit ? S.admin.pw : d.pw;
  const gid = edit ? S.admin.group.id : uid();
  const group = {id:gid, name:d.name.trim(), date:d.date, count:d.count, pool:d.pool.slice(), drawnAt:Date.now(), members:drawAll(names, d.pool, d.count)};
  S.err = ""; S.busy = "추첨 중..."; render();
  try{
    const pins = new Set(), cards = [];
    for(let i = 0; i < group.members.length; i++){
      const m = group.members[i];
      setBusy(`카드 포장 중 ${i+1}/${group.members.length}`);
      m.pw = randPin(pins); pins.add(m.pw);
      m.key = await idxKey(gid, m.pw);
      m.code = await seal(m.pw, {v:1, gid, g:group.name, n:m.name, t:m.target, m:m.missions, d:group.date});
      cards.push({key:m.key, blob:m.code});
    }
    setBusy("서버에 저장 중...");
    await apiRpc("save_group", {p_id:gid, p_token:await adminToken(gid, adminPw), p_name:group.name, p_count:group.members.length, p_blob:await seal(adminPw, group), p_cards:cards});
    LS.set(sentKey(gid), {}); LS.set(letterLogKey(gid), {}); rememberGroup(group);
    S.busy = false;
    go("admin", {admin:{pw:adminPw, group, delivered:[]}});
    toast(edit ? "다시 추첨했어요. 새 비밀번호를 보내 주세요" : "추첨 완료! 이제 카드를 보내요");
  }catch(e){ S.busy = false; S.err = "저장하지 못했어요. " + netMsg(e); render(); }
}

async function tryUnlock(){
  const pin = S.pin, gid = S.gid; S.busy = true;
  const e0 = $("#err"); if(e0) e0.textContent = "확인하는 중...";
  try{
    const key = await idxKey(gid, pin);
    let row;
    try{ row = await fetchCard(key); }catch(e){ S.busy = false; S.pin = ""; S.err = netMsg(e); render(); return; }
    if(!row) throw new Error("nocard");
    const card = await unseal(pin, row.blob);
    const storeLetters = [];
    try{ for(const lb of await fetchLetters(key)){ try{ const l = await unseal(pin, lb); if(l.gid === card.gid) storeLetters.push(l); }catch(e){} } }catch(e){}
    S.storeLetters = storeLetters;
    S.card = card; S.cardPw = pin; S.busy = false;
    const cards = LS.get(K_CARDS, []).filter(c => !(c.gid === card.gid && c.n === card.n));
    cards.unshift({gid:card.gid, g:card.g, n:card.n}); LS.set(K_CARDS, cards);
    let rec = null; const saved = LS.get(recKey(card.gid, card.n), null);
    if(saved){ try{ rec = await unseal(pin, saved); }catch(e){ rec = null; } }
    S.rec = Object.assign({done:card.m.map(() => false), entries:[], words:[], read:{}, letters:[], sentAt:0}, rec || {});
    ["words","letters"].forEach(k => { if(!Array.isArray(S.rec[k])) S.rec[k] = []; }); if(!S.rec.read) S.rec.read = {};
    if(S.rec.done.length !== card.m.length) S.rec.done = card.m.map((_, i) => !!S.rec.done[i]);
    go("card", {opened:false, pin:""});
  }catch(e){
    S.busy = false; S.pin = ""; S.err = "비밀번호가 맞지 않아요. 리더에게 받은 4자리를 다시 눌러 주세요."; render();
    const p = $("#lockPanel"); if(p){ p.classList.add("shake"); if(S.view === "home") p.scrollIntoView({block:"center"}); }
  }
}

function allLetters(){

}

    S.rec.entries.push({id:uid(), date, text, s:S.sticker});
    S.rec.entries.sort((a,b) => b.date.localeCompare(a.date));
    render(); saveRec(); toast("일기를 붙였어요");
  },
  delEntry(b){
    const id = b.dataset.id;
    if(S.confirm !== id){ S.confirm = id; render(); toast("한 번 더 누르면 지워져요"); setTimeout(() => { if(S.confirm === id){ S.confirm = null; if(S.view === "card") render(); } }, 3000); return; }
    S.rec.entries = S.rec.entries.filter(e => e.id !== id); S.confirm = null; render(); saveRec();
  },
  addWord(){
    const text = $("#w-text").value.trim();
    if(!text){ $("#werr").textContent = "하고 싶은 말을 한 줄이라도 적어 주세요."; return; }
    S.rec.words.push({id:uid(), date:todayStr(), text}); render(); saveRec(); toast("적어 두었어요");
  },
  delWord(b){
    const id = b.dataset.id;
    if(S.confirm !== id){ S.confirm = id; render(); toast("한 번 더 누르면 지워져요"); setTimeout(() => { if(S.confirm === id){ S.confirm = null; if(S.view === "card") render(); } }, 3000); return; }
    S.rec.words = S.rec.words.filter(w => w.id !== id); S.confirm = null; render(); saveRec();
  },
  async sendDiary(){
    const c = S.card, r = S.rec;
    const code = await sealG(c.gid, {v:1, n:c.n, t:c.t, m:c.m, done:r.done, entries:r.entries, words:r.words, at:Date.now()});
    const msg = `📮 [${c.g}] ${c.n}의 마니또 일기가 도착했어요\n리더 관리실의 '받은 일기 전달하기'에 이 메시지를 통째로 붙여넣으면 마니또에게 익명 편지로 전달돼요.\n\nmd${code}`;
    showSheet(`<h3>리더에게 보낼 메시지</h3><p class="soft small">복사해서 리더와의 카톡에 붙여넣어 보내 주세요.</p><textarea class="input" id="sheetText" readonly style="min-height:150px;font-size:13px;word-break:break-all">${esc(msg)}</textarea><div class="row"><button class="btn berry" data-act="copyDiaryMsg">복사하기</button><button class="btn ghost" data-act="closeSheet">닫기</button></div>`);
  },
  copyDiaryMsg(){ const t = $("#sheetText"); copyText(t.value).then(ok => { if(ok){ closeSheet(); toast("복사했어요. 리더에게 카톡으로 보내 주세요"); } }); S.rec.sentAt = Date.now(); saveRec(); if(S.view === "card") render(); },
  openLetter(b){ const id = b.dataset.id; S.openLetter = id; if(!S.rec.read[id]){ S.rec.read[id] = true; saveRec(); } render(); },
  closeLetter(){ S.openLetter = null; render(); },
  copyDiary(){
    const c = S.card, r = S.rec;
    const t = `[${c.g}] ${c.n}의 마니또 일기\n마니또: ${c.t}\n\n미션\n` + c.m.map((m,i) => (r.done[i] ? "✅ " : "⬜ ") + m).join("\n") + "\n\n기록\n" + r.entries.slice().reverse().map(e => `${fmtDate(e.date)} ${e.s} ${e.text}`).join("\n");
    copyText(t).then(ok => { if(ok) toast("일기를 복사했어요"); });
  }
};
function pressKey(k){
  if((S.view !== "unlock" && S.view !== "home") || S.busy) return;
  if(k === "c") S.pin = ""; else if(k === "b") S.pin = S.pin.slice(0, -1); else if(/^\d$/.test(k) && S.pin.length < 4) S.pin += k;
  S.err = "";
  document.querySelectorAll(".dots i").forEach((d, i) => d.classList.toggle("on", i < S.pin.length));
  const e = $("#err"); if(e) e.textContent = ""; $("#lockPanel")?.classList.remove("shake");
  if(S.pin.length === 4){ S.busy = true; setTimeout(tryUnlock, 120); }
}

document.addEventListener("click", e => { const b = e.target.closest("[data-act]"); if(!b || !ACT[b.dataset.act]) return; e.preventDefault(); ACT[b.dataset.act](b, e); });
app.addEventListener("input", e => { const t = e.target; if(t.dataset.lbind && S.letter){ S.letter[t.dataset.lbind] = t.value; return; } if(t.dataset.bind && S.draft){ S.draft[t.dataset.bind] = t.value; if(t.dataset.bind === "members") updateChips(); } });
app.addEventListener("keydown", e => {
  if(e.key === "Enter" && e.target.id === "f-newm"){ e.preventDefault(); ACT.addMission(); }
  if(e.key === "Enter" && e.target.id === "a-pw"){ e.preventDefault(); ACT.adminLogin(); }
});
document.addEventListener("keydown", e => {
  if(S.view !== "unlock" && S.view !== "home") return;
  const t = e.target; if(t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
  if(/^\d$/.test(e.key)) pressKey(e.key); else if(e.key === "Backspace") pressKey("b");
});

async function init(){
  S.gid = urlGid().replace(/[^0-9A-Za-z]/g, "");
  render();
  if(S.gid && CONFIGURED){
    try{ const g = await fetchGroup(S.gid); if(g){ S.gname = g.name; } else { S.gid = ""; toast("링크의 그룹을 찾지 못했어요"); } }
    catch(e){ toast(netMsg(e)); }
    if(S.view === "home") render();
  }
}
init();
</script>
